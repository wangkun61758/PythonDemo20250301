[pytest]
#1、 -s -v --html=路径/文件名.html（-s：输出调试信息，-v：显示更详细的信息）
addopts = -s -v --html=./resources/reports/main_ini_report.html

#2、--reruns 重跑次数 --reruns-delay 等待时长
#addopts = -s -v --html=./resources/report.html --reruns 1 --reruns-delay 1

#3、执行以 tests_unitest 开头的测试用例
testpaths =./test_cases/cases/tests_ini #测试用例的路径
#python_files = tests_unitest*.py  #模块名的规则
#addopts = --log-cli-level=INFO 设置了控制台日志的级别为 INFO
#addopts = -s -v --html=../reports/allure-results/report.html

#指定了日志文件的名称为 pytest.log
#log_file = pytest.log
#设置了日志文件的日志级别为 INFO
#log_file_level = INFO
#设置了日志文件的格式，包括时间戳、日志级别和日志消息
#log_file_format = %(asctime)s | %(filename)s | %(funcName)s | line:%(lineno)d | %(levelname)s | %(message)s
